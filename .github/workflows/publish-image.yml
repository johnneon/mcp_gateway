name: publish-image

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Short SHA
        id: image
        run: echo "short_sha=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Package version
        id: version
        run: |
          version="$(node --input-type=module -e "import { readFileSync } from 'node:fs'; const version = JSON.parse(readFileSync('package.json', 'utf8')).version; if (typeof version !== 'string' || !/^[0-9]+\.[0-9]+\.[0-9]+$/.test(version)) { console.error('root package.json version must be MAJOR.MINOR.PATCH'); process.exit(1); } process.stdout.write(version);")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: |
            ghcr.io/johnneon/mcp_gateway:latest
            ghcr.io/johnneon/mcp_gateway:${{ steps.image.outputs.short_sha }}
            ghcr.io/johnneon/mcp_gateway:${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Set package visibility
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          export GH_TOKEN="${GITHUB_TOKEN}"
          package="user/packages/container/mcp_gateway"
          visibility=""
          attempt=1
          while [ "$attempt" -le 6 ]; do
            if visibility="$(gh api "$package" --jq '.visibility // ""')"; then
              if [ -n "$visibility" ]; then
                break
              fi
            else
              visibility=""
            fi
            attempt=$((attempt + 1))
            sleep 5
          done
          if [ "$visibility" = "public" ]; then
            echo "Package is already public."
            exit 0
          fi
          if [ -z "$visibility" ]; then
            echo "Package visibility was not returned."
            exit 1
          fi
          if ! gh api --method PUT "$package" -f visibility=public; then
            after=""
            after="$(gh api "$package" --jq '.visibility // ""')" || after=""
            if [ "$after" != "public" ]; then
              gh api --method PATCH "$package" -f visibility=public
            fi
          fi
          final="$(gh api "$package" --jq '.visibility // ""')"
          if [ "$final" != "public" ]; then
            echo "Package visibility is not public."
            exit 1
          fi
