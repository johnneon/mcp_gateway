schema: spec-driven

context: |
  Read AGENTS.md before writing artifacts.
  MCP Gateway is one Node.js process. It stores connector credentials and exposes a fixed tool list over MCP Streamable HTTP. A bearer token authenticates the MCP client. Connector secrets stay inside the process.
  Write change artifacts in Russian. MCP tool names, descriptions, error text, and admin UI copy stay in English.
  Product vision is mcp-gateway-spec.md. Current behavior is openspec/specs. The contract for this change is its own delta specs.
  A new connector is a new change plus code. Do not add a runtime catalog of tools.

rules:
  proposal:
    - One change, one outcome. Name a connector only when this change adds or changes one.
    - State the non-goals of this change.
  specs:
    - Requirements use SHALL. Each requirement has at least one Given/When/Then scenario.
    - Scenarios are testable with a fake provider, without a live external service.
  design:
    - Hosts and secrets stay in gateway code. Model arguments do not carry a URL, a host, or a secret.
  tasks:
    - Each task is small enough to implement and test in one pass.
    - Include automated tests for the new scenarios.

operations:
  apply:
    guidance:
      - Implement only the accepted tasks.
      - Do not edit mcp-gateway-spec.md or files under openspec/specs. Archive merges specs.
      - Follow the backend, frontend, and tests skills.
  archive:
    guidance:
      - Archive only after .harness/reports/<change>.md exists and lists no blockers.
